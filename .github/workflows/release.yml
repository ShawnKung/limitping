name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Build archives
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            archive=limitping_${version}_${os}_${arch}
            mkdir -p "dist/$archive"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/ShawnKung/limitping/internal/cli.version=$version" \
              -o "dist/$archive/limitping" ./cmd/limitping
            cp LICENSE README.md THIRD_PARTY_NOTICES.md "dist/$archive/"
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
            rm -rf "dist/$archive"
          done
          cd dist
          sha256sum *.tar.gz > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
