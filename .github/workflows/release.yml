name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build binaries
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          commit=${GITHUB_SHA}
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            binary=limitping_${version}_${os}_${arch}
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/ShawnKung/limitping/internal/cli.version=$version -X github.com/ShawnKung/limitping/internal/cli.commit=$commit" \
              -o "dist/$binary" ./cmd/limitping
            chmod 0755 "dist/$binary"
          done
          cd dist
          sha256sum limitping_* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
