name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22.x", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: make check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Cross-compile supported targets
        run: |
          set -eu
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o /tmp/limitping-$os-$arch ./cmd/limitping
          done
